<!doctype html>
<!-- Editorial: обкладинка журналу. Масштабна назва-шапка Playfair Display, тонкі лінійки, анонси статей на кадрі,
     цитата курсивом у кінці, друкарське зерно поверх. Картинка трохи «приглушена», як на папері. -->
<html lang="uk" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root { --paper: #fbf8f2; --accent: #d7262f; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; font-family: "Inter", sans-serif; color: var(--paper); }
      .full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #plate { z-index: 1; } #cut { z-index: 3; }
      .layer { position: absolute; inset: 0; z-index: 2; }
      .front { z-index: 4; }
      .shade { position: absolute; left: 0; top: 0; width: 1080px; height: 760px; background: linear-gradient(#0008, #0000); }
      .mast { position: absolute; left: 0; width: 1080px; top: 236px; text-align: center; font-family: "Playfair Display", serif; font-weight: 900;
              font-size: 206px; line-height: 1; letter-spacing: -0.03em; }
      .rule { position: absolute; left: 64px; width: 952px; height: 2px; background: var(--paper); transform-origin: left; }
      .kick { position: absolute; font-weight: 700; font-size: 26px; letter-spacing: 0.22em; }
      .line { position: absolute; left: 64px; width: 560px; font-family: "Playfair Display", serif; font-weight: 700; font-size: 66px; line-height: 1.02; letter-spacing: -0.01em; }
      .line em { font-style: italic; font-weight: 400; }
      .tag { display: block; font-family: "Inter", sans-serif; font-weight: 700; font-size: 24px; letter-spacing: 0.2em; color: var(--accent); margin-bottom: 12px; }
      .quote { position: absolute; left: 64px; width: 900px; top: 1030px; font-family: "Playfair Display", serif; font-style: italic; font-size: 92px; line-height: 1.02; letter-spacing: -0.015em; }
      .quote b { font-style: normal; font-weight: 900; color: var(--accent); }
      .w { display: inline-block; }
      #grain { position: absolute; inset: 0; z-index: 6; mix-blend-mode: overlay; opacity: 0.55; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8.4" data-width="1080" data-height="1920">
      <video id="plate" class="clip full" data-start="0" data-duration="8.4" data-track-index="0" src="assets/plate.mp4" muted playsinline></video>

      <!-- шапка журналу: за людиною -->
      <div id="head" class="clip layer" data-start="0" data-duration="8.4" data-track-index="1">
        <div class="shade"></div>
        <div class="kick" id="iss" style="left:64px;top:182px">ВИПУСК 01</div>
        <div class="kick" id="iss2" style="right:64px;top:182px">REELS СТУДІЯ</div>
        <div class="rule" id="r1" style="top:224px"></div>
        <div class="mast" id="mast"><span class="w" id="m1">М</span><span class="w" id="m2">О</span><span class="w" id="m3">Н</span><span class="w" id="m4">Т</span><span class="w" id="m5">А</span><span class="w" id="m6">Ж</span></div>
        <div class="rule" id="r2" style="top:478px"></div>
      </div>

      <video id="cut" class="clip full" data-start="0" data-duration="8.4" data-track-index="2" src="assets/cutout.webm" muted playsinline data-layout-allow-occlusion></video>

      <!-- анонси на обкладинці: поверх людини, ліва колонка -->
      <div id="c1" class="clip layer front" data-start="0.3" data-duration="1.04" data-track-index="3">
        <div class="line" id="c1t" style="top:1080px"><span class="tag">ГОЛОВНЕ</span>Я просто <em>описую</em> словами</div>
      </div>
      <div id="c2" class="clip layer front" data-start="2.36" data-duration="2.40" data-track-index="3">
        <div class="line" id="c2t" style="top:1040px"><span class="tag">БЕЗ ПРОГРАМ</span>Жодної програми <em>для монтажу</em></div>
      </div>
      <div id="c3" class="clip layer front" data-start="4.84" data-duration="1.96" data-track-index="3">
        <div class="line" id="c3a" style="top:980px;font-size:58px"><span class="tag">№ 1</span>Швидка склейка</div>
        <div class="line" id="c3b" style="top:1150px;font-size:58px"><span class="tag">№ 2</span>Більші титри</div>
      </div>
      <div id="c4" class="clip layer front" data-start="6.84" data-duration="1.56" data-track-index="3">
        <div class="quote" id="q">«Це просто ще <b class="w" id="q1">одне</b> <b class="w" id="q2">речення.</b>»</div>
      </div>

      <img id="grain" class="clip" data-start="0" data-duration="8.4" data-track-index="5" src="assets/grain.png" alt="" />
      <audio id="voice" class="clip" data-start="0" data-duration="8.4" data-track-index="9" src="assets/voice.m4a" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // шапка: літери по одній, як набір у друкарні, на слові «описую»
      tl.fromTo(["#m1", "#m2", "#m3", "#m4", "#m5", "#m6"], { opacity: 0, yPercent: 18 }, { opacity: 1, yPercent: 0, duration: 0.5, ease: "expo.out", stagger: 0.05 }, 0.12);
      tl.fromTo(["#r1", "#r2"], { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.inOut", stagger: 0.1 }, 0.05);
      tl.fromTo(["#iss", "#iss2"], { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.35);
      // анонси проявляються з розмиття, без зсуву
      const blurIn = (sel, t) => tl.fromTo(sel, { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.28, ease: "power3.out" }, t);
      const blurOut = (sel, t) => tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, t);
      blurIn("#c1t", 0.40); blurOut("#c1t", 1.16);
      blurIn("#c2t", 2.40); blurOut("#c2t", 4.58);
      blurIn("#c3a", 4.86); blurIn("#c3b", 5.96); blurOut(["#c3a", "#c3b"], 6.62);
      blurIn("#q", 6.88);
      tl.fromTo("#q1", { color: "#fbf8f2" }, { color: "#d7262f", duration: 0.12 }, 7.62);
      tl.fromTo("#q2", { color: "#fbf8f2" }, { color: "#d7262f", duration: 0.12 }, 7.86);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
