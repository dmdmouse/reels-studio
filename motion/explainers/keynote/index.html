<!doctype html>
<!-- Dark tech keynote: майже чорна сцена, тонка сітка, один помаранчевий акцент, світло пробігає по гігантському числу.
     Три факти курсу по черзі: 46 ефектів → 10 стилів → 1 речення. Число рахує, світло проходить, підпис стоїть нерухомо.
     Звук: низький удар під кожним числом, райзер перед останнім. Музики немає. -->
<html lang="uk" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root { --bg: #0b0b0d; --or: #f36b35; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); font-family: "Inter", sans-serif; color: #f2f2f2; }
      .grid { position: absolute; inset: 0; background-image: linear-gradient(#ffffff0d 1px, transparent 1px), linear-gradient(90deg, #ffffff0d 1px, transparent 1px);
              background-size: 90px 90px; background-position: 0 0; }
      .floor { position: absolute; left: 0; right: 0; top: 1180px; height: 2px; background: linear-gradient(90deg, #0000, #ffffff30, #0000); }
      .num { position: absolute; left: 0; width: 1080px; top: 470px; text-align: center; font-weight: 900; font-size: 560px; line-height: 1; letter-spacing: -0.06em;
             background: linear-gradient(100deg, #b9b9c0 0%, #d8d8de 38%, #ffffff 50%, #d8d8de 62%, #b9b9c0 100%); background-size: 300% 100%;
             background-position: var(--sweep, 120%) 0; -webkit-background-clip: text; background-clip: text; color: transparent; }
      .lab { position: absolute; left: 0; width: 1080px; top: 1060px; text-align: center; font-weight: 700; font-size: 64px; letter-spacing: -0.02em; }
      .lab b { color: var(--or); }
      .kick { position: absolute; left: 0; width: 1080px; top: 300px; text-align: center; font-family: "JetBrains Mono", monospace; font-size: 30px; letter-spacing: 0.3em; color: #8a8a90; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="9" data-track-index="0" style="position:absolute;inset:0">
        <div class="grid" id="grid"></div>
        <div class="floor"></div>
        <div class="kick" id="kick">REELS СТУДІЯ · КУРС ЗА 4 ДНІ</div>
      </div>
      <div id="f1" class="clip" data-start="0.4" data-duration="2.6" data-track-index="1" style="position:absolute;inset:0">
        <div class="num" id="n1">46</div><div class="lab" id="t1">ефектів з рецептами</div>
      </div>
      <div id="f2" class="clip" data-start="3.0" data-duration="2.6" data-track-index="1" style="position:absolute;inset:0">
        <div class="num" id="n2">10</div><div class="lab" id="t2">стилів моушн-графіки</div>
      </div>
      <div id="f3" class="clip" data-start="5.6" data-duration="3.4" data-track-index="1" style="position:absolute;inset:0">
        <div class="num" id="n3">1</div><div class="lab" id="t3">речення — і <b>рілс готовий</b></div>
      </div>
      <audio id="a1" class="clip" data-start="0.40" data-duration="2.0" data-track-index="5" src="assets/sfx/sub.wav" data-volume="0.38"></audio>
      <audio id="a2" class="clip" data-start="3.00" data-duration="2.0" data-track-index="5" src="assets/sfx/sub.wav" data-volume="0.38"></audio>
      <audio id="a3" class="clip" data-start="4.20" data-duration="1.4" data-track-index="6" src="assets/sfx/riser.wav" data-volume="0.18"></audio>
      <audio id="a4" class="clip" data-start="5.60" data-duration="1.4" data-track-index="7" src="assets/sfx/impact.wav" data-volume="0.35"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#grid", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 0);
      tl.fromTo("#kick", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.2);
      tl.to("#grid", { backgroundPosition: "0px 90px", duration: 9, ease: "none" }, 0);   // сітка повільно пливе — сцена жива, текст нерухомий
      const fact = (n, t, lab, t0, from, to) => {
        const o = { v: from };
        tl.fromTo(n, { opacity: 0, scale: 0.92, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, t0);
        if (to !== from) tl.to(o, { v: to, duration: 0.9, ease: "power3.out", onUpdate: () => { document.querySelector(n).textContent = Math.round(o.v); } }, t0);
        tl.fromTo(n, { "--sweep": "120%" }, { "--sweep": "-20%", duration: 1.1, ease: "power2.inOut" }, t0 + 0.5);
        tl.fromTo(lab, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, t0 + 0.35);
        tl.to([n, lab], { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power2.in" }, t0 + 2.35);
      };
      fact("#n1", null, "#t1", 0.4, 1, 46);
      fact("#n2", null, "#t2", 3.0, 1, 10);
      // останнє число не зникає
      tl.fromTo("#n3", { opacity: 0, scale: 1.3, filter: "blur(20px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "expo.out" }, 5.6);
      tl.fromTo("#n3", { "--sweep": "120%" }, { "--sweep": "-20%", duration: 1.2, ease: "power2.inOut" }, 6.0);
      tl.fromTo("#t3", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 6.0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
